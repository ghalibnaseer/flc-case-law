name: Sync from Google Sheet and publish

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (UTC)
  workflow_dispatch:            # "Run workflow" button for an immediate update
  push:
    branches: [main]

# Publishing is done by Cloudflare Pages, which deploys every push to main
# (including the data commits made below) behind the shared password in
# functions/_middleware.js. GitHub Pages is no longer used.
permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest entries from the Google Sheet
        if: ${{ env.SHEET_CSV_URL != '' }}
        run: python scripts/sync_sheet.py "$SHEET_CSV_URL" data/cases.json

      - name: Save updated data to the repository
        if: ${{ env.SHEET_CSV_URL != '' }}
        run: |
          if [ -n "$(git status --porcelain data/cases.json)" ]; then
            git config user.name "flc-database-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/cases.json
            git commit -m "Sync case law database from Google Sheet"
            git push
          else
            echo "No changes in the sheet."
          fi
