name: Sync from Google Sheet and publish

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (UTC)
  workflow_dispatch:            # "Run workflow" button for an immediate update
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest entries from the Google Sheet
        if: ${{ vars.SHEET_CSV_URL != '' }}
        run: python scripts/sync_sheet.py "${{ vars.SHEET_CSV_URL }}" data/cases.json

      - name: Save updated data to the repository
        if: ${{ vars.SHEET_CSV_URL != '' }}
        run: |
          if [ -n "$(git status --porcelain data/cases.json)" ]; then
            git config user.name "flc-database-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/cases.json
            git commit -m "Sync case law database from Google Sheet"
            git push
          else
            echo "No changes in the sheet."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
